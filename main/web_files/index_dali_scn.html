<script>

var savedGroupId = 0;
var savedSceneIds = [0,0,0,0]; 
var savedControlType = 'Individual Control'; 
var savedControlType1 = 'Broadcast Control'; 

function showToast(message, type = "info", duration = 3000) {
  const toast = document.getElementById("toast");
  if (!toast) return console.error("Toast element missing!");

  // Reset classes
  toast.className = "toast";
  toast.textContent = message;
  toast.classList.add(type);
  toast.classList.add("show");

  // Auto-hide after duration
  setTimeout(() => {
    toast.classList.remove("show");
  }, duration);
}


document.addEventListener('DOMContentLoaded',function(){document.getElementById('group_id').value = savedGroupId;
document.getElementById('scene1').value = savedSceneIds[0];
document.getElementById('scene2').value = savedSceneIds[1];
document.getElementById('scene3').value = savedSceneIds[2];
document.getElementById('scene4').value = savedSceneIds[3]; 
document.getElementById('control_type').value = savedControlType; 
document.getElementById('control_type1').value = savedControlType1;});

function updateHeader(newText) { 
document.getElementById('mainHeader').textContent = newText; 
} 
function updateTitle(newTitle) { 
document.title = newTitle; updateHeader(newTitle); 
} 
function setInputRange(min, max) {
 let input1 = document.getElementById('scene1'); 
 input1.min = min; input1.max = max; 
 let input2 = document.getElementById('scene2');
 input2.min = min; input2.max = max;
 let input3 = document.getElementById('scene3'); 
 input3.min = min; input3.max = max; 
 let input4 = document.getElementById('scene4'); 
 input4.min = min; input4.max = max; 
} 
 
 function updateGroupIdVisibility(show) {
 var groupIdLabel = document.getElementById('groupIdLabel'); 
 var groupIdInput = document.getElementById('group_id'); 
 groupIdLabel.style.display = show ? '' : 'none'; 
 groupIdInput.style.display = show ? '' : 'none'; }
 document.getElementById('control_type').addEventListener('change', function() {
 var val = this.value; var groupIdLabel = document.getElementById('groupIdLabel'); 
 var groupIdInput = document.getElementById('group_id'); 
 var sceneLabels = [ document.getElementById('scene1Label'), document.getElementById('scene2Label'), document.getElementById('scene3Label'), document.getElementById('scene4Label') ];   if (val === 'Individual Control') { groupIdLabel.style.display = 'none'; groupIdInput.style.display = 'none'; sceneLabels[0].innerText = 'Dali ID 1:'; sceneLabels[1].innerText = 'Dali ID 2:'; sceneLabels[2].innerText = 'Dali ID 3:'; sceneLabels[3].innerText = 'Dali ID 4:'; setInputRange(0, 63); updateTitle("DALI Id's Control Switch"); updateGroupIdVisibility(false); } else if (val === 'Group Control' || val === 'Broadcast Control') { groupIdLabel.style.display = 'none'; groupIdInput.style.display = 'none'; sceneLabels[0].innerText = 'Group ID 1:'; sceneLabels[1].innerText = 'Group ID 2:'; sceneLabels[2].innerText = 'Group ID 3:'; sceneLabels[3].innerText = 'Group ID 4:'; if (val === 'Group Control'){ updateTitle("DALI Group Control Switch"); updateGroupIdVisibility(false); setInputRange(0, 15); }else{ updateTitle("DALI Broadcast Control Switch"); setInputRange(0, 15); updateGroupIdVisibility(false); } } else if (val === 'Scene Control') { groupIdLabel.style.display = ''; groupIdInput.style.display = ''; sceneLabels[0].innerText = 'Scene ID 1:'; sceneLabels[1].innerText = 'Scene ID 2:'; sceneLabels[2].innerText = 'Scene ID 3:'; sceneLabels[3].innerText = 'Scene ID 4:'; setInputRange(0, 15); } var sceneDiv = document.getElementById('sceneControlDiv'); if (this.value === 'Scene Control') { sceneDiv.style.display = 'block'; var val = document.getElementById('control_type1').value; if (val === 'Broadcast Control') { updateGroupIdVisibility(false); updateTitle("DALI Scene Control Switch"); setInputRange(0, 15); }else if(val === 'Individual Control') { updateGroupIdVisibility(false); updateTitle("DALI Scene Control Switch"); setInputRange(0, 63); } else if (val === 'Group Control') { updateGroupIdVisibility(true); updateTitle("DALI Scene Control Switch (group required)"); setInputRange(0, 15); } } else { sceneDiv.style.display = 'none'; } }); document.getElementById('control_type1').addEventListener('change', function() { var val = this.value; if (document.getElementById('sceneControlDiv').style.display !== 'none') { if (val === 'Broadcast Control' || val === 'Individual Control') { updateGroupIdVisibility(false); } else if (val === 'Group Control') { updateGroupIdVisibility(true); } } }); document.getElementById('sceneForm').onsubmit = async function(e) { e.preventDefault(); const data = { fxn: '40', group_id: parseInt(document.getElementById('group_id').value), scene_ids: [ parseInt(document.getElementById('scene1').value), parseInt(document.getElementById('scene2').value), parseInt(document.getElementById('scene3').value), parseInt(document.getElementById('scene4').value) ], control_type:document.getElementById('control_type').selectedIndex, scn_ctrl_type:document.getElementById('control_type1').selectedIndex }; const res = await fetch('/action', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) }); }; document.addEventListener('DOMContentLoaded', function() { fetch('/items?fxn=15') .then(response => response.json()) .then(data => { document.getElementById('group_id').value = data.group_id; document.getElementById('scene1').value = data.scene_ids[0]; document.getElementById('scene2').value = data.scene_ids[1]; document.getElementById('scene3').value = data.scene_ids[2]; document.getElementById('scene4').value = data.scene_ids[3]; document.getElementById('control_type').value = data.control_type; document.getElementById('control_type1').value = data.scn_ctrl_type; if (document.getElementById('control_type').value == 'Scene Control' || document.getElementById('control_type').value == 'Individual Control' || document.getElementById('control_type').value == 'Broadcast Control') { updateGroupIdVisibility(false); }else{ updateGroupIdVisibility(true); } if (document.getElementById('control_type').value == 'Scene Control'){ document.getElementById('sceneControlDiv').style.display = 'block'; }else{ document.getElementById('sceneControlDiv').style.display = 'none'; }}); fetch('/items?fxn=16') .then(response => response.json()) .then(data => { if (Array.isArray(data) && data.length === 4) { popupSelections = data.map(arr => Array.isArray(arr) ? arr : []); } console.log('Loaded popupSelections:', popupSelections); }) .catch(err => { console.error('Failed to load popupSelections:', err); });});let currentInput = null; let popupSelections = [[], [], [], []]; (function initGrid() { let grid = ''; for (let i = 0; i < 64; i++) { grid += `<button class="toggle-btn" id="btn${i}" onclick="toggleBtn(${i})">${i}</button>`; if (i % 8 === 0) grid += '<br>'; } document.getElementById('toggleGrid').innerHTML = grid; })(); ['scene1','scene2','scene3','scene4'].forEach((id, idx) => { let el = document.getElementById(id); let pressTimer; 

function tryShowPopup() { 
const ctrlType = document.getElementById('control_type').value; 
if (ctrlType === 'Individual Control' || ctrlType === 'Group Control') { 
openPopup(idx); 
}else if (ctrlType === 'Scene Control') {
 const ctrlType1 = document.getElementById('control_type1').value;
 if (ctrlType1 === 'Individual Control') { openPopup(idx); 
 } 
 } 
 } 
 function sendClickIndex(idx, id) { 
 const payload = { fxn: '42', index: idx, id: id }; 
 fetch('/action', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) }) .then(res => res.text()) .then(data => { }) .catch(err => {
 setTimeout(() => {
  showToast('Error sending data: ' + err);
}, 1000);
  });
 }
el.addEventListener('mousedown', () => pressTimer = setTimeout(tryShowPopup, 600)); 
el.addEventListener('mouseup', () => clearTimeout(pressTimer)); 
el.addEventListener('mouseleave', () => clearTimeout(pressTimer)); el.addEventListener('touchstart', () => pressTimer = setTimeout(tryShowPopup, 600)); el.addEventListener('touchend', () => clearTimeout(pressTimer)); el.addEventListener('click', function() { sendClickIndex(idx, id); }); }); 

function openPopup(inputIdx) { 
currentInput = inputIdx; 
let selected = popupSelections[inputIdx] || []; 
for (let i = 0; i < 64; i++) {
 const btn = document.getElementById('btn' + i);
 if (selected.includes(i)) {
 btn.classList.add('selected'); 
 } else {
 btn.classList.remove('selected'); 
 } 
 } 
 document.getElementById('popup').style.display = 'block'; 
 document.getElementById('overlay').style.display = 'block'; 
 } 
 
 function toggleBtn(id) { let selected = popupSelections[currentInput] || []; const index = selected.indexOf(id); if (index === -1) { selected.push(id); } else { selected.splice(index, 1); } popupSelections[currentInput] = selected; const btn = document.getElementById(`btn${id}`); btn.classList.toggle('selected'); } function submitSelection() { if (currentInput === null) return; const selected = popupSelections[currentInput].slice().sort((a, b) => a - b); const payload = { fxn: '41', input_id: currentInput, selected_ids: selected }; fetch('/action', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) }) .then(res => res.text()) .then(data => { closePopup(); }) .catch(err => { 
 
 setTimeout(() => {
  showToast("Error sending data!", "error");
}, 1000);
 closePopup(); }); } function closePopup() { document.getElementById('popup').style.display = 'none'; document.getElementById('overlay').style.display = 'none'; }

// Populate dropdowns
function populateDropdown(el, max) {
    for(let i=0;i<=max;i++) {
        let opt = document.createElement('option');
        opt.value = i;
        opt.textContent = i;
        el.appendChild(opt);
    }
}
populateDropdown(document.getElementById('daliAddress'), 63);
populateDropdown(document.getElementById('groupSelect'), 15);
populateDropdown(document.getElementById('sceneGroupSelect'), 15);

// Store per-group selections
let groupSelections = {};  // { groupId: [ids] }
let sceneSelections = {};  // { groupId: [scenes] }

// Create toggle grids
function createGrid(containerId, count, selectedList=[]) {
    const container = document.getElementById(containerId);
    container.innerHTML = '';
    for(let i=0;i<count;i++) {
        let btn = document.createElement('button');
        btn.textContent = i;
        btn.className = 'toggle-btn';
        if (selectedList.includes(i)) btn.classList.add('selected');
        btn.onclick = ()=>{
            btn.classList.toggle('selected');
        };
        container.appendChild(btn);
        if((i+1)%8===0) container.appendChild(document.createElement('br'));
    }
}

// Initialize default grids
createGrid('groupIdGrid', 64); // Group membership IDs
createGrid('sceneGrid', 16);   // Scenes 0–15

// Change group selection (membership)
document.getElementById('groupSelect').addEventListener('change', ()=>{
    let g = parseInt(document.getElementById('groupSelect').value);
    createGrid('groupIdGrid', 64, groupSelections[g] || []);
});

// Change group selection (scene)
document.getElementById('sceneGroupSelect').addEventListener('change', ()=>{
    let g = parseInt(document.getElementById('sceneGroupSelect').value);
    createGrid('sceneGrid', 16, sceneSelections[g] || []);
});

// Save selections before sending
function getSelectedFromGrid(containerId) {
    return Array.from(document.querySelectorAll(`#${containerId} .selected`))
                .map(b=>parseInt(b.textContent));
}

// 1. SEND DALI ADDRESS
document.getElementById('sendDaliAddress').onclick = ()=>{
    let address = parseInt(document.getElementById('daliAddress').value);
    fetch('/action', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({fxn:'12', max_addr:address})
    }).then(res=>res.text()).then(showToast);
};

// 2. SEND GROUP MEMBERSHIP
document.getElementById('sendGroupMembership').onclick = ()=>{
    let group = parseInt(document.getElementById('groupSelect').value);
    let ids = getSelectedFromGrid('groupIdGrid');
    groupSelections[group] = ids; // Save it
    fetch('/action', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({fxn:'51', group_id:group, dali_ids:ids})
    }).then(res=>res.text()).then(showToast);
};

// 3. SEND SCENES
document.getElementById('sendScenes').onclick = ()=>{
    let group = parseInt(document.getElementById('sceneGroupSelect').value);
    let scenes = getSelectedFromGrid('sceneGrid');
    sceneSelections[group] = scenes; // Save it
    fetch('/action', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({fxn:'52', group_id:group, scenes:scenes})
    }).then(res=>res.text()).then(showToast);
};


/* ----- Tab switching + lazy-init for DALI tab ----- */
(function() {
  const tabButtons = document.querySelectorAll('.tab-btn');
  const tabContents = document.querySelectorAll('.tab-content');
  let daliInitialized = false;

  function showTab(name) {
    // hide all contents and remove active from buttons
    tabContents.forEach(tc => tc.classList.remove('active'));
    tabButtons.forEach(tb => tb.classList.remove('active'));

    // show the requested content and set active button
    const targetContent = document.getElementById(name);
    if (targetContent) targetContent.classList.add('active');

    // set corresponding button active
    tabButtons.forEach(tb => {
      if (tb.dataset.tab === name) tb.classList.add('active');
    });

    // If showing DALI tab, ensure its UI is initialized (only once)
    if (name === 'daliSettings' && !daliInitialized) {
      try {
        // Populate dropdowns and grids if not already populated
        // (these functions are defined earlier in your script)
        populateDropdown(document.getElementById('daliAddress'), 63);
        populateDropdown(document.getElementById('groupSelect'), 15);
        populateDropdown(document.getElementById('sceneGroupSelect'), 15);

        // create grids with any saved selections if applicable
        createGrid('groupIdGrid', 64, groupSelections[parseInt(document.getElementById('groupSelect').value)] || []);
        createGrid('sceneGrid', 16, sceneSelections[parseInt(document.getElementById('sceneGroupSelect').value)] || []);

        // If you want to fetch current server state for DALI tab on open:
        // (uncomment if your backend supports the endpoints)
        // fetch('/items?fxn=15').then(r=>r.json()).then(data=>{ /* update UI */ });
      } catch (err) {
        console.warn('DALI init error (may already be initialized or functions missing):', err);
      }
      daliInitialized = true;
    }
  }

  // Attach click handlers
  tabButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      const tabName = btn.dataset.tab;
      if (!tabName) return;
      showTab(tabName);
    });
  });

  // Optionally make initial tab match markup (already set to sceneControl)
  // but ensure UI functions for the visible tab are ready:
  document.addEventListener('DOMContentLoaded', () => {
    // Show whichever tab button has .active in markup
    const activeBtn = document.querySelector('.tab-btn.active');
    if (activeBtn && activeBtn.dataset.tab) {
      showTab(activeBtn.dataset.tab);
    } else {
      // fallback
      showTab('sceneControl');
    }
  });

})();
</script>
</body>
</html>
